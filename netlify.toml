# ==============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION
# Dr. Rabeya's Surgery Note & Clinical Practice Website
# ==============================================================================

[build]
  # Static site with plain HTML, CSS, JavaScript (no build command needed)
  publish = "."

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Asset caching for stylesheets and scripts
[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Redirect contact page to homepage appointment section
[[redirects]]
  from = "/contact"
  to = "/#appointment"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/#appointment"
  status = 301

